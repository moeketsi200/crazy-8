services:
  - type: web
    name: crazy8-game-server
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm install --omit=dev
    startCommand: npm run backend:start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: CRAZY8_SETTLEMENT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: crazy8-storage
          property: connectionString

databases:
  - name: crazy8-storage
    databaseName: crazy8
    user: crazy8
    plan: basic-256mb
